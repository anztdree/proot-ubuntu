<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndexedDB Universal Studio & Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    .dark ::-webkit-scrollbar-thumb:hover {
      background: #0d9488;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #0d9488;
    }
    
    /* Dynamic Theme Glass Effects */
    .glass-card {
      transition: background-color 0.3s, border-color 0.3s;
    }
    .dark .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .glass-header {
      transition: background-color 0.3s, border-color 0.3s;
    }
    .dark .glass-header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border-color: rgba(255, 255, 255, 0.08);
    }
    .glass-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      border-color: rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 font-sans min-h-screen p-3 sm:p-6 transition-colors duration-300 selection:bg-teal-500 selection:text-white">

  <div class="max-w-7xl mx-auto space-y-4 sm:space-y-6">
    
    <!-- HEADER NAVBAR -->
    <header class="glass-header sticky top-0 z-40 p-4 rounded-2xl border shadow-xl flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="p-3 bg-teal-500/10 border border-teal-500/30 rounded-xl text-teal-600 dark:text-teal-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
        </div>
        <div>
          <h1 class="text-xl font-extrabold tracking-wide bg-gradient-to-r from-teal-600 via-emerald-600 to-indigo-600 dark:from-teal-400 dark:via-emerald-300 dark:to-indigo-400 bg-clip-text text-transparent">
            IndexedDB Studio
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 font-mono">Live Management & Data Inspector</p>
        </div>
      </div>

      <!-- Control Menu -->
      <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
        <button onclick="toggleTheme()" id="themeToggleBtn" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs rounded-xl transition flex items-center gap-1.5 font-bold">
          <span id="themeIcon">🌙</span> <span id="themeText">Dark</span>
        </button>

        <div class="relative flex-1 sm:flex-initial min-w-[140px]">
          <select id="dbSelect" onchange="switchDatabase(this.value)" class="w-full bg-slate-200/80 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 hover:border-teal-500 text-teal-700 dark:text-teal-300 text-xs rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-teal-500/50 transition appearance-none pr-8 cursor-pointer font-mono font-semibold">
            <option value="">🔍 Scanning DB...</option>
          </select>
          <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 text-xs">▼</div>
        </div>
        
        <button onclick="scanDatabases()" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700 text-xs text-slate-700 dark:text-slate-200 rounded-xl transition flex items-center gap-1 font-medium">
          🔄 Scan
        </button>

        <button onclick="loadData()" class="px-3 py-2 bg-teal-500/10 hover:bg-teal-500/20 dark:bg-teal-600/20 dark:hover:bg-teal-600/30 border border-teal-500/40 text-teal-700 dark:text-teal-300 text-xs rounded-xl transition flex items-center gap-1 font-medium">
          ⚡ Refresh
        </button>

        <button onclick="exportCurrentStore()" class="px-3 py-2 bg-indigo-500/10 hover:bg-indigo-500/20 dark:bg-indigo-600/20 dark:hover:bg-indigo-600/30 border border-indigo-500/40 text-indigo-700 dark:text-indigo-300 text-xs rounded-xl transition flex items-center gap-1 font-medium">
          📥 Export
        </button>

        <button onclick="deleteEntireDatabase()" class="px-3 py-2 bg-rose-500/10 hover:bg-rose-500/20 dark:bg-rose-600/20 dark:hover:bg-rose-600/30 border border-rose-500/40 text-rose-600 dark:text-rose-400 text-xs rounded-xl transition font-medium">
          🔥 Hapus DB
        </button>
      </div>
    </header>

    <!-- STATS METRICS -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="glass-card p-3 sm:p-4 rounded-xl shadow-sm">
        <p class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-mono tracking-wider">Active Database</p>
        <p id="statDbName" class="text-xs sm:text-sm font-bold text-teal-600 dark:text-teal-400 truncate mt-1">-</p>
      </div>
      <div class="glass-card p-3 sm:p-4 rounded-xl shadow-sm">
        <p class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-mono tracking-wider">Active Store</p>
        <p id="statStoreName" class="text-xs sm:text-sm font-bold text-emerald-600 dark:text-emerald-400 truncate mt-1">-</p>
      </div>
      <div class="glass-card p-3 sm:p-4 rounded-xl shadow-sm">
        <p class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-mono tracking-wider">Total Rows</p>
        <p id="statRowCount" class="text-xs sm:text-sm font-bold text-indigo-600 dark:text-indigo-400 font-mono mt-1">0</p>
      </div>
      <div class="glass-card p-3 sm:p-4 rounded-xl shadow-sm">
        <p class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-mono tracking-wider">Primary Key</p>
        <p id="statKeyPath" class="text-xs sm:text-sm font-bold text-amber-600 dark:text-amber-400 font-mono mt-1">-</p>
      </div>
    </div>

    <!-- MAIN SECTION -->
    <div class="grid grid-cols-12 gap-4 sm:gap-6">
      
      <!-- SIDEBAR OBJECT STORES -->
      <aside class="col-span-12 lg:col-span-3 glass-card p-4 rounded-2xl shadow-sm h-fit">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider font-mono">Object Stores</h2>
          <span id="storeBadge" class="text-[10px] bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 px-2 py-0.5 rounded-full font-mono">0</span>
        </div>
        <div id="storeButtons" class="flex flex-col gap-1.5 max-h-[30vh] lg:max-h-[60vh] overflow-y-auto pr-1">
          <p class="text-xs text-slate-400 italic">Scanning DB...</p>
        </div>
      </aside>

      <!-- DATA CONTENT -->
      <main class="col-span-12 lg:col-span-9 glass-card p-4 sm:p-5 rounded-2xl shadow-sm flex flex-col gap-4">
        
        <!-- Toolbar & Search -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
          <h2 id="currentStoreTitle" class="text-sm sm:text-base font-bold text-slate-800 dark:text-slate-200">
            Pilih Store
          </h2>
          <div class="relative w-full sm:w-64">
            <input type="text" id="searchInput" oninput="filterData(this.value)" placeholder="🔍 Cari data/key..." class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700/80 text-xs text-slate-800 dark:text-slate-200 rounded-xl px-3.5 py-2 outline-none focus:border-teal-500/80 font-mono placeholder:text-slate-400 dark:placeholder:text-slate-600">
          </div>
        </div>

        <!-- MOBILE CARD VIEW CONTAINER (Hanya Tampil di HP/Tablet Small) -->
        <div id="mobileCardContainer" class="block md:hidden space-y-3 max-h-[60vh] overflow-y-auto pr-1">
          <p class="text-xs text-slate-400 text-center py-6">Memuat data...</p>
        </div>

        <!-- DESKTOP TABLE VIEW CONTAINER (Tampil di Desktop / Tablet Wide) -->
        <div class="hidden md:block overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-800/80 bg-slate-50 dark:bg-slate-900/40 max-h-[60vh] overflow-y-auto">
          <table class="w-full text-left text-xs border-collapse">
            <thead class="sticky top-0 z-10 bg-slate-200/90 dark:bg-slate-900/90 backdrop-blur-md text-teal-700 dark:text-teal-300 font-mono border-b border-slate-300 dark:border-slate-800">
              <tr id="tableHeader">
                <!-- Header Dinamis -->
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-200 dark:divide-slate-800/60 font-mono text-slate-700 dark:text-slate-300">
              <tr>
                <td class="p-8 text-center text-slate-400" colspan="100%">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <!-- MODAL EDIT JSON -->
  <div id="editModal" class="fixed inset-0 bg-slate-950/60 dark:bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 transition-all duration-200">
    <div class="glass-card border border-slate-300 dark:border-slate-700 w-full max-w-2xl rounded-2xl shadow-2xl p-4 sm:p-6 flex flex-col gap-4 bg-white dark:bg-slate-900">
      
      <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-teal-600 dark:text-teal-400 flex items-center gap-2">
          <span>✏️</span> Edit Data Row (JSON)
        </h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white text-lg transition">✕</button>
      </div>

      <div>
        <label class="text-xs text-slate-500 dark:text-slate-400 mb-2 block font-mono">Ubah struktur/isi JSON di bawah ini:</label>
        <textarea id="jsonArea" class="w-full h-72 bg-slate-900 text-emerald-400 font-mono text-xs p-4 rounded-xl border border-slate-700 focus:outline-none focus:border-teal-500/80 transition shadow-inner leading-relaxed" spellcheck="false"></textarea>
      </div>

      <div class="flex justify-end gap-2.5 pt-2 border-t border-slate-200 dark:border-slate-800">
        <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl text-xs font-medium transition">Batal</button>
        <button onclick="saveRowChanges()" class="px-4 py-2 bg-teal-600 hover:bg-teal-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-teal-900/30">💾 Simpan Perubahan</button>
      </div>
    </div>
  </div>

  <script>
    let activeDB = null;
    let currentStore = '';
    let currentDbName = '';
    let storeKeyPath = null;
    let rawStoreData = [];
    let rawStoreKeys = [];

    // --- DARK / LIGHT MODE CONTROLLER ---
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        updateThemeUI(false);
      } else {
        document.documentElement.classList.add('dark');
        updateThemeUI(true);
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeUI(isDark);
    }

    function updateThemeUI(isDark) {
      document.getElementById('themeIcon').innerText = isDark ? '🌙' : '☀️';
      document.getElementById('themeText').innerText = isDark ? 'Dark' : 'Light';
    }

    initTheme();

    // 1. SCAN ALL DATABASES
    async function scanDatabases() {
      const dbSelect = document.getElementById('dbSelect');
      dbSelect.innerHTML = '<option value="">🔍 Scanning...</option>';

      try {
        if (!indexedDB.databases) {
          alert('Browser Anda tidak mendukung API indexedDB.databases().');
          return;
        }

        const dbs = await indexedDB.databases();
        dbSelect.innerHTML = '';

        if (dbs.length === 0) {
          dbSelect.innerHTML = '<option value="">❌ DB Tidak Ditemukan</option>';
          document.getElementById('storeButtons').innerHTML = '<p class="text-xs text-rose-500 p-2">Tidak ada Database terdeteksi.</p>';
          renderData([]);
          return;
        }

        dbs.forEach((dbInfo) => {
          const opt = document.createElement('option');
          opt.value = dbInfo.name;
          opt.innerText = `🗄️ ${dbInfo.name} (v${dbInfo.version})`;
          dbSelect.appendChild(opt);
        });

        switchDatabase(dbs[0].name);

      } catch (err) {
        console.error('Gagal scan DB:', err);
      }
    }

    // 2. SWITCH DATABASE
    async function switchDatabase(dbName) {
      if (!dbName) return;
      currentDbName = dbName;
      document.getElementById('statDbName').innerText = dbName;

      if (activeDB) {
        activeDB.close();
        activeDB = null;
      }

      try {
        activeDB = await connectDB(dbName);
        const storeNames = Array.from(activeDB.objectStoreNames);
        const container = document.getElementById('storeButtons');
        document.getElementById('storeBadge').innerText = storeNames.length;
        container.innerHTML = '';

        if (storeNames.length === 0) {
          container.innerHTML = '<p class="text-xs text-slate-400 p-2">Database kosong (0 Store).</p>';
          document.getElementById('statStoreName').innerText = '-';
          renderData([]);
          return;
        }

        storeNames.forEach((store, idx) => {
          const btn = document.createElement('button');
          btn.className = `w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-mono transition flex items-center justify-between group border border-transparent text-slate-600 dark:text-slate-400 hover:bg-slate-200/60 dark:hover:bg-slate-800/60 hover:text-slate-800 dark:hover:text-slate-200`;
          btn.innerHTML = `<span>📦 ${store}</span> <span class="opacity-0 group-hover:opacity-100 transition text-[10px] text-teal-500">➜</span>`;
          btn.onclick = () => selectStore(store, btn);
          container.appendChild(btn);

          if (idx === 0) selectStore(store, btn);
        });

      } catch (err) {
        alert(`Gagal membuka DB "${dbName}": ` + err.message);
      }
    }

    function connectDB(dbName) {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(dbName);
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    // 3. SELECT STORE
    function selectStore(storeName, btnEl) {
      currentStore = storeName;
      document.getElementById('statStoreName').innerText = storeName;

      document.querySelectorAll('#storeButtons button').forEach(b => {
        b.classList.remove('bg-teal-500/10', 'text-teal-600', 'dark:text-teal-300', 'border-teal-500/30', 'font-bold');
        b.classList.add('text-slate-600', 'dark:text-slate-400');
      });

      if (btnEl) {
        btnEl.classList.add('bg-teal-500/10', 'text-teal-600', 'dark:text-teal-300', 'border-teal-500/30', 'font-bold');
        btnEl.classList.remove('text-slate-600', 'dark:text-slate-400');
      }

      const tx = activeDB.transaction(storeName, 'readonly');
      storeKeyPath = tx.objectStore(storeName).keyPath;
      document.getElementById('statKeyPath').innerText = storeKeyPath || '(Auto Key)';

      document.getElementById('currentStoreTitle').innerText = `Store: ${storeName}`;
      loadData();
    }

    // 4. LOAD & RENDER DATA
    function loadData() {
      if (!activeDB || !currentStore) return;

      const tx = activeDB.transaction(currentStore, 'readonly');
      const store = tx.objectStore(currentStore);
      
      const reqAll = store.getAll();
      const reqKeys = store.getAllKeys();

      Promise.all([
        new Promise(r => reqAll.onsuccess = () => r(reqAll.result)),
        new Promise(r => reqKeys.onsuccess = () => r(reqKeys.result))
      ]).then(([data, keys]) => {
        rawStoreData = data;
        rawStoreKeys = keys;
        document.getElementById('statRowCount').innerText = data.length;
        document.getElementById('searchInput').value = '';
        renderData(data, keys);
      });
    }

    function renderData(data, keys = rawStoreKeys) {
      renderDesktopTable(data, keys);
      renderMobileCards(data, keys);
    }

    // RENDER TABLE UNTUK DESKTOP
    function renderDesktopTable(data, keys) {
      const thead = document.getElementById('tableHeader');
      const tbody = document.getElementById('tableBody');
      thead.innerHTML = '';
      tbody.innerHTML = '';

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td class="p-8 text-center text-slate-400" colspan="100%">Data kosong.</td></tr>';
        return;
      }

      const columns = Array.from(new Set(data.flatMap(Object.keys)));

      const thAction = document.createElement('th');
      thAction.className = 'p-3 text-center w-24 border-r border-slate-300 dark:border-slate-800';
      thAction.innerText = 'Aksi';
      thead.appendChild(thAction);

      columns.forEach(k => {
        const th = document.createElement('th');
        th.className = 'p-3 whitespace-nowrap border-r border-slate-300 dark:border-slate-800/60 font-semibold';
        th.innerText = k + (storeKeyPath === k ? ' 🔑' : '');
        thead.appendChild(th);
      });

      data.forEach((row, idx) => {
        const primaryKey = keys ? keys[idx] : row[storeKeyPath];
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-200/50 dark:hover:bg-slate-800/50 transition border-b border-slate-200 dark:border-slate-800/40';

        const tdAction = document.createElement('td');
        tdAction.className = 'p-2.5 text-center whitespace-nowrap border-r border-slate-300 dark:border-slate-800/60 space-x-1.5';
        
        const btnEdit = document.createElement('button');
        btnEdit.className = 'bg-amber-500/10 hover:bg-amber-500/20 text-amber-600 dark:text-amber-400 border border-amber-500/30 px-2 py-1 rounded-md text-[10px] font-bold transition';
        btnEdit.innerText = '✏️ Edit';
        btnEdit.onclick = () => openEditModal(row);

        const btnDel = document.createElement('button');
        btnDel.className = 'bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 border border-rose-500/30 px-2 py-1 rounded-md text-[10px] font-bold transition';
        btnDel.innerText = '🗑️ Del';
        btnDel.onclick = () => deleteKey(primaryKey);

        tdAction.appendChild(btnEdit);
        tdAction.appendChild(btnDel);
        tr.appendChild(tdAction);

        columns.forEach(k => {
          const td = document.createElement('td');
          td.className = 'p-3 border-r border-slate-200 dark:border-slate-800/40 font-mono text-xs whitespace-pre-wrap break-all';
          const val = row[k];
          
          if (typeof val === 'object' && val !== null) {
            td.innerHTML = `<span class="text-indigo-600 dark:text-indigo-400">${JSON.stringify(val, null, 2)}</span>`;
          } else {
            td.innerText = val !== undefined ? val : '';
            if (typeof val === 'number') td.className += ' text-emerald-600 dark:text-emerald-400';
            if (typeof val === 'boolean') td.className += ' text-purple-600 dark:text-purple-400';
          }

          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });
    }

    // RENDER CARD UNTUK MOBILE (Mencegah Teks Terpotong)
    function renderMobileCards(data, keys) {
      const container = document.getElementById('mobileCardContainer');
      container.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">Data kosong.</p>';
        return;
      }

      data.forEach((row, idx) => {
        const primaryKey = keys ? keys[idx] : row[storeKeyPath];
        const card = document.createElement('div');
        card.className = 'p-3.5 bg-slate-200/50 dark:bg-slate-900/80 border border-slate-300 dark:border-slate-800 rounded-xl space-y-3 font-mono text-xs';

        // Header Card (Primary Key & Aksi)
        const header = document.createElement('div');
        header.className = 'flex justify-between items-center border-b border-slate-300 dark:border-slate-800 pb-2';
        header.innerHTML = `<span class="text-teal-600 dark:text-teal-400 font-bold">Item #${idx + 1} ${primaryKey !== undefined ? `(Key: ${primaryKey})` : ''}</span>`;
        
        const actionBox = document.createElement('div');
        actionBox.className = 'flex gap-1.5';

        const btnEdit = document.createElement('button');
        btnEdit.className = 'bg-amber-500/10 hover:bg-amber-500/20 text-amber-600 dark:text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-md text-[10px] font-bold';
        btnEdit.innerText = '✏️ Edit';
        btnEdit.onclick = () => openEditModal(row);

        const btnDel = document.createElement('button');
        btnDel.className = 'bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 border border-rose-500/30 px-2.5 py-1 rounded-md text-[10px] font-bold';
        btnDel.innerText = '🗑️ Del';
        btnDel.onclick = () => deleteKey(primaryKey);

        actionBox.appendChild(btnEdit);
        actionBox.appendChild(btnDel);
        header.appendChild(actionBox);
        card.appendChild(header);

        // Body Properties (Key-Value List)
        const body = document.createElement('div');
        body.className = 'space-y-2';

        Object.keys(row).forEach(k => {
          const val = row[k];
          const item = document.createElement('div');
          item.className = 'bg-slate-100 dark:bg-slate-950 p-2 rounded-lg border border-slate-200 dark:border-slate-800/80';
          
          let formattedVal = '';
          if (typeof val === 'object' && val !== null) {
            formattedVal = `<pre class="text-indigo-600 dark:text-indigo-400 whitespace-pre-wrap break-all text-[11px] mt-1">${JSON.stringify(val, null, 2)}</pre>`;
          } else {
            formattedVal = `<span class="break-all text-slate-800 dark:text-slate-200">${val !== undefined ? val : ''}</span>`;
          }

          item.innerHTML = `
            <div class="text-[10px] font-bold text-teal-700 dark:text-teal-300 uppercase tracking-wide">${k} ${storeKeyPath === k ? '🔑' : ''}</div>
            ${formattedVal}
          `;
          body.appendChild(item);
        });

        card.appendChild(body);
        container.appendChild(card);
      });
    }

    // 5. LIVE FILTER / SEARCH
    function filterData(query) {
      if (!query.trim()) {
        renderData(rawStoreData, rawStoreKeys);
        return;
      }
      
      const q = query.toLowerCase();
      const filteredKeys = [];
      const filteredData = rawStoreData.filter((item, idx) => {
        const matches = JSON.stringify(item).toLowerCase().includes(q);
        if (matches) filteredKeys.push(rawStoreKeys[idx]);
        return matches;
      });

      renderData(filteredData, filteredKeys);
    }

    // 6. EXPORT TO JSON FILE
    function exportCurrentStore() {
      if (!rawStoreData || rawStoreData.length === 0) {
        alert('Tidak ada data yang bisa diexport!');
        return;
      }
      const jsonStr = JSON.stringify(rawStoreData, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentDbName}_${currentStore}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 7. DELETE KEY
    function deleteKey(key) {
      if (!confirm(`Apakah Anda yakin ingin menghapus Key: "${key}"?`)) return;

      const tx = activeDB.transaction(currentStore, 'readwrite');
      const store = tx.objectStore(currentStore);
      const req = store.delete(key);

      req.onsuccess = () => loadData();
      req.onerror = (e) => alert('Gagal menghapus key: ' + e.target.error.message);
    }

    // 8. DELETE ENTIRE DATABASE
    function deleteEntireDatabase() {
      const dbSelect = document.getElementById('dbSelect');
      const targetDb = dbSelect.value || currentDbName;

      if (!targetDb) {
        alert('⚠️ Pilih database yang ingin dihapus terlebih dahulu!');
        return;
      }

      if (!confirm(`🚨 PERINGATAN HAPUS 🚨\n\nYakin hapus PERMANEN database "${targetDb}"?`)) return;

      if (activeDB) {
        activeDB.close();
        activeDB = null;
      }

      const deleteRequest = indexedDB.deleteDatabase(targetDb);

      deleteRequest.onsuccess = function () {
        alert(`✅ Database "${targetDb}" berhasil dihapus!`);
        currentDbName = '';
        currentStore = '';
        scanDatabases();
      };

      deleteRequest.onerror = function (e) {
        alert(`❌ Gagal menghapus database: ${e.target.error.message}`);
      };

      deleteRequest.onblocked = function () {
        alert(`⚠️ Terblokir! Tutup tab game/aplikasi yang sedang menggunakan DB ini.`);
      };
    }

    // 9. EDIT MODAL HANDLERS
    function openEditModal(rowData) {
      document.getElementById('jsonArea').value = JSON.stringify(rowData, null, 2);
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function saveRowChanges() {
      try {
        const updatedData = JSON.parse(document.getElementById('jsonArea').value);
        
        const tx = activeDB.transaction(currentStore, 'readwrite');
        const store = tx.objectStore(currentStore);
        const req = store.put(updatedData);

        req.onsuccess = () => {
          closeEditModal();
          loadData();
        };

        req.onerror = (e) => alert('Gagal menyimpan: ' + e.target.error.message);

      } catch (err) {
        alert('Format JSON tidak valid!\n\nError: ' + err.message);
      }
    }

    window.onload = scanDatabases;
  </script>
</body>
</html>
